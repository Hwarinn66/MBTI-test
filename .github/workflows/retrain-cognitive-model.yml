name: Retrain cognitive reason model

on:
  push:
    branches: [main]
    paths:
      - "data/cognitive_reasons*.csv"
      - "train_model.py"
      - "ml_local.py"
      - "requirements-training.txt"
      - ".github/workflows/retrain-cognitive-model.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-training.txt

      - name: Install training dependencies
        run: python -m pip install -r requirements-training.txt

      - name: Train and evaluate combined V1 + V2 model
        run: python train_model.py

      - name: Commit regenerated model when changed
        shell: bash
        run: |
          if git diff --quiet -- models/cognitive_text.json.gz models/evaluation.json; then
            echo "Model artifacts are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/cognitive_text.json.gz models/evaluation.json
          git commit -m "Retrain cognitive model with V1 and V2 datasets"
          git push
